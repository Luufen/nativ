# Phantasy Star Nova (PCSG00351, Japan; PSN-NOVA-JP 2026-11-19: port of packs/PCSH00143, the Asia copy).
# Built from the 1.05 update (owner: the update first, then the English rePatch data mod over it: the mod's one file
# replaces the update's NOVA_FileList_Vita_patch.cpk). Engine line as PCSH00143 1.00: same modules, the Asia pack's
# ARM vtable seed found here by its byte signature (one hit at 16..48 bytes).
NAME = "ファンタシースター ノヴァ"
REGION = "Japan"
ELF = "eboot.bin.elf"
MODULES = "libc libgxm_es4 libgpu_es4 libfios2 libsceavplayer libpvf libscemp4 libSceFt2"
TEST_FRAMES = 5400        # the title screen (PCSH00143: "PRESS START BUTTON" from ~f5100, no input)
TEST_TIMEOUT = 900
# PSN-NOVA-JP-60 (owner-confirmed at 60 fps 2026-11-19: "yes its fine"): the engine paces by an fps field (fn_81a24692: 60 / [obj+0xcc] vblanks a frame)
# and times its updates by the vblanks elapsed; frames30 makes that field 60 at 60 fps (frame_rates menu)
RUN_ENV = "RECOMP_FRAME_RATES=30,60"
# note: shipped in sce_module/ but not loaded: libface libsmart libult (add to MODULES if the run stubs their imports)

[versions."1.05"]
sha256 = "abb45e179726d3021de144a900f912534fa6879061e068228cc0cd55286edcf3"
status = "supported"
# = PCSH00143 1.00's 0x8204c890 (an ARM vtable function reached only through an even pointer from Thumb code, blx r2,
# frame 0), mapped by byte signature
FUNCTION_SEEDS = "0x8209d688:arm"
IHOOKS = "0x81a246be:frames30"
