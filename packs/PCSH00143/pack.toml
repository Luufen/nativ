# Phantasy Star Nova (PCSH00143, Asia, Chinese; from `vitarecomp pack-init`, then PSN-NOVA 2026-11-18).
# Headless, no input: the SEGA logo ~f300, the intro movie ~f600-4500, the title with "PRESS START BUTTON" from ~f5100.
# Played on Windows (2026-11-18/19): past character creation into the game, with an in-game save; Circle confirms.
# Not checked: frame rates above 30, widescreen, resolutions above 1x.
NAME = "夢幻之星 NOVA"
REGION = "Asia"
ELF = "eboot.bin.elf"
MODULES = "libc libgxm_es4 libgpu_es4 libfios2 libsceavplayer libpvf libscemp4 libSceFt2"
TEST_FRAMES = 5400        # the title screen ("PRESS START BUTTON" from ~f5100, no input)
TEST_TIMEOUT = 900
# note: shipped in sce_module/ but not loaded: libface libsmart libult (add to MODULES if the run stubs their imports)

[versions."1.00"]
sha256 = "ffe9d9e79cd1c50cea3df9d5c984f1f62b7e22bfa3cf179bc6e00fe586f0d51d"
status = "supported"
# found on runs (a new copy needs it from its first build): 0x8204c890 is an ARM vtable function (type id) reached
# only through an even pointer from Thumb code (blx r2, frame 0)
FUNCTION_SEEDS = "0x8204c890:arm"

